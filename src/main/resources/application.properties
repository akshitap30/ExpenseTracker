spring.application.name=ExpenseTracker

# =========================================================
# DATABASE
# =========================================================

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true


# =========================================================
# JWT
# =========================================================

jwt.secret=${JWT_SECRET:expenseTrackerDefaultSecretKeyForLocalDev}


# =========================================================
# LOGGING
# =========================================================

logging.file.name=logs/expense-tracker.log

logging.level.root=INFO

logging.level.com.project1.ExpenseTracker.service=DEBUG

logging.level.com.project1.ExpenseTracker.security=DEBUG


# =========================================================
# FILE UPLOAD
# =========================================================

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

file.upload-dir=${UPLOAD_DIR:uploads}


# =========================================================
# MAILTRAP
# =========================================================

spring.mail.host=live.smtp.mailtrap.io
spring.mail.port=587

spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true


# =========================================================
# ACTUATOR
# =========================================================

management.endpoints.web.exposure.include=health