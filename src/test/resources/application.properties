# =========================================================
# DATABASE
# =========================================================
# H2 in-memory database in PostgreSQL compatibility mode
# Used only for running tests — no external database needed
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;DATABASE_TO_UPPER=false
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# =========================================================
# JWT
# =========================================================
jwt.secret=test-secret-key-for-unit-tests-at-least-32-bytes

# =========================================================
# FILE UPLOAD
# =========================================================
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
file.upload-dir=uploads-test

# =========================================================
# MAIL
# =========================================================
# Dummy SMTP config for tests. JavaMailSender is created from
# these properties but never connects at startup.
spring.mail.host=localhost
spring.mail.port=3025
spring.mail.username=test
spring.mail.password=test
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false

# =========================================================
# ACTUATOR
# =========================================================
management.endpoints.web.exposure.include=health

# =========================================================
# LOGGING
# =========================================================
logging.level.root=WARN
logging.level.com.project1.ExpenseTracker=WARN
